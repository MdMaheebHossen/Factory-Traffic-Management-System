{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Traffic Dashboard</title>
    <style>
        body { background: #1e1e1e; color: white; text-align: center; font-family: Arial; }
        .box { background: #2d2d2d; padding: 20px; margin: 10px; display: inline-block; border-radius: 10px; width: 120px; }
        .light { width: 50px; height: 50px; border-radius: 50%; margin: 10px auto; background: gray; }
        .red { background: red; box-shadow: 0 0 10px red; }
        .yellow { background: yellow; box-shadow: 0 0 10px yellow; }
        .green { background: lime; box-shadow: 0 0 10px lime; }
    </style>
</head>
<body>
    <h1>Junction A Dashboard</h1>
    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% else %}
        <div class="box"><h3>NORTH</h3><div class="light {{ north_state|lower }}"></div><p>Queue: {{ north_queue }}</p></div>
        <div class="box"><h3>EAST</h3><div class="light {{ east_state|lower }}"></div><p>Queue: {{ east_queue }}</p></div>
        <div class="box"><h3>SOUTH</h3><div class="light {{ south_state|lower }}"></div><p>Queue: {{ south_queue }}</p></div>
        <div class="box"><h3>WEST</h3><div class="light {{ west_state|lower }}"></div><p>Queue: {{ west_queue }}</p></div>
    {% endif %}
</body>
</html>
